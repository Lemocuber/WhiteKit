name: Build

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read

jobs:
  app:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            artifact: whitekit-macos
          - name: Windows
            os: windows-latest
            artifact: whitekit-windows
            target: x86_64-pc-windows-msvc
            executable: src-tauri/target/x86_64-pc-windows-msvc/release/whitekit.exe
          - name: Windows ARM
            os: windows-latest
            artifact: whitekit-windows-arm
            target: aarch64-pc-windows-msvc
            executable: src-tauri/target/aarch64-pc-windows-msvc/release/whitekit.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Set up Rust
        if: runner.os == 'macOS'
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Rust target
        if: runner.os == 'Windows'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm run test

      - name: Lint
        run: npm run lint

      - name: Build macOS app bundle
        if: runner.os == 'macOS'
        run: npx tauri build --bundles app --ci --no-sign

      - name: Build Windows portable executable
        if: runner.os == 'Windows'
        run: npx tauri build --no-bundle --ci --target ${{ matrix.target }}

      - name: Package macOS artifact
        if: runner.os == 'macOS'
        run: |
          ditto -c -k --keepParent src-tauri/target/release/bundle/macos/WhiteKit.app "${{ matrix.artifact }}.zip"

      - name: Package Windows artifact
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path ${{ matrix.executable }} -DestinationPath "${{ matrix.artifact }}.zip"

      - name: Upload macOS artifact
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.zip
          archive: false
          if-no-files-found: error
          retention-days: 14

      - name: Upload Windows artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.zip
          archive: false
          if-no-files-found: error
          retention-days: 14
